
<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Error 404. La página que buscás no se encuentra disponible en Tramo."
    >

    <meta name="theme-color" content="#FAF7F5">

    <title>Error 404 | Tramo</title>

    <link
        rel="icon"
        type="image/png"
        href="img/favicon.png"
    >

    <!-- Tipografía Montserrat -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Estilos exclusivos del error 404 -->

    <link rel="stylesheet" href="css/404.css">

</head>

<body>

    <main class="pagina-error">

        <div class="container">

            <section
                class="contenido-error"
                aria-labelledby="tituloError"
            >

                <!-- ÍCONO -->

                <div class="icono-error">

                    <i
                        class="bi bi-box-seam"
                        aria-hidden="true"
                    ></i>

                    <span class="signo-error" aria-hidden="true">
                        <i class="bi bi-question-lg"></i>
                    </span>

                </div>


                <!-- CÓDIGO -->

                <span class="etiqueta-error">
                    ENVÍO NO ENCONTRADO
                </span>

                <h1 id="tituloError" class="numero-error">
                    404
                </h1>


                <!-- MENSAJE -->

                <h2 class="titulo-error">
                    ¡Ups! Este paquete tomó
                    el camino equivocado.
                </h2>

                <p class="descripcion-error">
                    La dirección que buscás no está
                    en nuestra ruta.
                    Pero no te preocupes:
                    podemos llevarte de vuelta al inicio.
                </p>


                <!-- BOTÓN DE REGRESO -->

                <a
                    href="index.html"
                    class="btn btn-volver"
                >

                    <i
                        class="bi bi-house-door"
                        aria-hidden="true"
                    ></i>

                    <span>
                        Volver al inicio
                    </span>

                </a>


                <!-- DETALLE DECORATIVO -->

                <div
                    class="ruta-decorativa"
                    aria-hidden="true"
                >

                    <span class="punto-ruta"></span>

                    <span class="linea-ruta"></span>

                    <i class="bi bi-geo-alt-fill"></i>

                </div>

            </section>

        </div>

    </main>

</body>
</html>
