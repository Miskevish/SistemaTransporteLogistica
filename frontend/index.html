<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transporte y Logística | Gestión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main id="pantallaIngreso" class="ingreso d-flex align-items-center justify-content-center p-3">
    <section class="tarjeta-ingreso bg-white rounded-4 shadow-sm p-4 p-md-5">
      <div class="marca-ingreso mb-4"><span class="logo-marca">TL</span><div><h1 class="h4 m-0">Transporte y Logística</h1><p class="text-secondary mb-0">Sistema de gestión</p></div></div>
      <h2 class="h5 fw-bold">Iniciar sesión</h2>
      <p class="text-secondary small">Ingresá con tu cuenta de administrador, operador o conductor.</p>
      <form id="formIngreso">
        <div class="mb-3"><label class="form-label" for="usuarioIngreso">Usuario</label><input class="form-control" id="usuarioIngreso" name="usuario" autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label" for="claveIngreso">Contraseña</label><input class="form-control" id="claveIngreso" name="clave" type="password" autocomplete="current-password" required></div>
        <div id="errorIngreso" class="text-danger small mb-3" role="alert"></div>
        <button class="btn btn-primary w-100" type="submit" id="botonIngreso">Ingresar</button>
      </form>
      <p class="text-secondary small mt-4 mb-0">Proyecto Taller Integrador II</p>
    </section>
  </main>
  <div id="aplicacion" class="d-none">
    <header class="cabecera d-flex align-items-center justify-content-between px-3 px-lg-4">
      <div class="d-flex align-items-center gap-2"><button class="btn btn-outline-secondary d-lg-none" id="botonMenu" aria-label="Abrir menú">☰</button><span class="logo-marca logo-pequeno">TL</span><span class="fw-bold">Transporte y Logística</span></div>
      <div class="d-flex align-items-center gap-2"><span id="usuarioActual" class="text-secondary small d-none d-sm-inline"></span><button class="btn btn-outline-secondary btn-sm" id="botonSalir">Cerrar sesión</button></div>
    </header>
    <div class="distribucion">
      <aside class="lateral" id="menuLateral"><p class="text-uppercase menu-titulo">Navegación</p><nav id="navegacion" class="d-grid gap-1"></nav></aside>
      <main class="contenido p-3 p-lg-4">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4"><div><p id="subtituloVista" class="text-uppercase text-secondary small mb-1">Panel de gestión</p><h1 id="tituloVista" class="h3 fw-bold mb-0">Inicio</h1></div><div id="accionesVista"></div></div>
        <div id="alertas" aria-live="polite"></div>
        <section id="contenidoVista"></section>
      </main>
    </div>
  </div>
  <div class="modal fade" id="modalFormulario" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h2 id="tituloModal" class="modal-title h5"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><form id="formRegistro"><div class="modal-body"><div id="camposModal" class="row g-3"></div><p class="text-secondary small mt-3 mb-0">Los campos marcados con * son obligatorios.</p></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" id="guardarRegistro" class="btn btn-primary">Guardar</button></div></form></div></div></div>
  <div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="tituloDetalle" aria-hidden="true"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h2 id="tituloDetalle" class="modal-title h5">Detalle</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body" id="contenidoDetalle"></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/configuracion.js"></script><script src="js/api.js"></script><script src="js/app.js"></script>
</body>
</html>
